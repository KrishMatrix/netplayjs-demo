<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no, minimum-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <title>Somnia Pong - NetplayJS</title>

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #222;
        font-family: system-ui, -apple-system, sans-serif;
      }

      #wallet-ui {
        position: fixed;
        top: 16px;
        left: 16px;
        right: 16px;
        z-index: 1000;
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 12px;
        background: rgba(0, 0, 0, 0.8);
        border-radius: 8px;
        color: white;
        font-size: 14px;
      }

      #wallet-ui button {
        padding: 8px 16px;
        border: none;
        border-radius: 6px;
        background: #049ef4;
        color: white;
        cursor: pointer;
        font-size: 14px;
      }

      #wallet-ui button:hover {
        background: #0388d1;
      }

      #wallet-ui input {
        padding: 6px 12px;
        border-radius: 6px;
        border: 1px solid #444;
        background: #333;
        color: white;
        font-size: 14px;
      }

      #wallet-ui input::placeholder {
        color: #888;
      }

      #status {
        opacity: 0.8;
        font-size: 12px;
      }

      #status a {
        color: #049ef4;
        text-decoration: none;
      }

      #status a:hover {
        text-decoration: underline;
      }

      #code-button {
        position: fixed;
        bottom: 16px;
        right: 16px;
        padding: 12px;
        border-radius: 50%;
        margin-bottom: 0px;
        background-color: #fff;
        opacity: 0.9;
        z-index: 999;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
      }

      #code-button img {
        display: block;
        width: 20px;
      }
    </style>
  </head>
  <body>
    <div id="wallet-ui">
      <div id="wallet">Not connected</div>
      <button id="connectBtn">Connect Wallet</button>
      <button id="addNetworkBtn" style="display: none;">Add Somnia Network</button>
      <input id="matchCode" placeholder="Match code (e.g. ABC123)" style="flex: 1;">
      <button id="joinBtn" disabled>Join Match</button>
      <div id="status"></div>
    </div>

    <a id="code-button" href="https://github.com/rameshvarun/netplayjs/tree/master/netplayjs-demo/src/examples/somnia-pong.ts" target="_blank">
      <img src="./files/ic_code_black_24dp.svg" />
    </a>

    <script src="https://cdn.jsdelivr.net/npm/ethers@6.11.1/dist/ethers.min.js"></script>
    <script>
      // Web3 functionality
      const SOMNIA = { 
        id: '0xC4B8', // Chain ID 50312 in hex
        idDecimal: '50312', // Chain ID in decimal
        // The correct Chain ID might be 50360
        idCorrect: '0xC4B8', // Chain ID 50360 in hex (0xC4B8 = 50360)
        idCorrectDecimal: '50360', // Chain ID 50360 in decimal
        // Alternative Chain IDs that might be correct
        idAlt1: '0xC4B9', // Chain ID 50313 in hex (alternative)
        idAlt2: '0xC4BA', // Chain ID 50314 in hex (alternative)
        idAlt3: '0xC4BB', // Chain ID 50315 in hex (alternative)
        rpc: 'https://dream-rpc.somnia.network', 
        exp: 'https://shannon-explorer.somnia.network' 
      };
      // Contract address on Somnia testnet:
      const CONTRACT_ADDR = '0x4e7890BfCaab0A4474e627794D4912979B4D92Ba';
      const ABI = [
        {"type":"function","name":"joinMatch","inputs":[{"name":"matchId","type":"bytes32"}],"outputs":[],"stateMutability":"payable"},
        {"type":"function","name":"reportMatch","inputs":[
          {"name":"matchId","type":"bytes32"},
          {"name":"winner","type":"address"},
          {"name":"scoreA","type":"uint8"},
          {"name":"scoreB","type":"uint8"}],"outputs":[],"stateMutability":"nonpayable"},
        {"type":"function","name":"getMatch","inputs":[{"name":"matchId","type":"bytes32"}],"outputs":[
          {"name":"player1","type":"address"},
          {"name":"player2","type":"address"},
          {"name":"scoreA","type":"uint8"},
          {"name":"scoreB","type":"uint8"},
          {"name":"winner","type":"address"},
          {"name":"isComplete","type":"bool"},
          {"name":"isPaid","type":"bool"},
          {"name":"timestamp","type":"uint256"}],"stateMutability":"view"},
        {"type":"function","name":"entryFee","inputs":[],"outputs":[{"name":"","type":"uint256"}],"stateMutability":"view"}
      ];

      let provider, signer, contract, myAddr;

      async function ensureSomnia() {
        console.log('ensureSomnia called');
        
        try {
          const chainId = await window.ethereum.request({ method: 'eth_chainId' });
          console.log('Current chain ID:', chainId);
          console.log('Expected chain ID (50360):', SOMNIA.idCorrectDecimal);
          console.log('Expected chain ID (50360 hex):', SOMNIA.idCorrect);
          console.log('Expected chain ID (50312):', SOMNIA.idDecimal);
          console.log('Expected chain ID (50312 hex):', SOMNIA.id);
          
          // Check if we're on the correct network (prioritizing 50360)
          if (chainId !== SOMNIA.idCorrectDecimal && chainId !== SOMNIA.idCorrect && 
              chainId !== SOMNIA.id && chainId !== SOMNIA.idDecimal) {
            console.log('Not on Somnia network, detecting correct Chain ID...');
            
            // First, try to detect the correct Chain ID
            const correctChainId = await detectCorrectChainId();
            console.log('Detected Chain ID:', correctChainId);
            
            if (correctChainId === 'pending') {
              console.log('Network addition already pending, waiting for user...');
              $('status').textContent = '⏳ Network addition in progress. Please complete it in MetaMask...';
              await waitForNetworkAddition();
              return;
            }
            
            if (correctChainId) {
              console.log('Found existing Somnia network, switching to it...');
              try {
                await window.ethereum.request({ 
                  method: 'wallet_switchEthereumChain', 
                  params: [{ chainId: correctChainId }] 
                });
                console.log('Successfully switched to Somnia');
              } catch (switchError) {
                console.error('Failed to switch to network:', switchError);
                throw new Error('Failed to switch to Somnia network');
              }
            } else {
              console.log('No existing Somnia network found, adding it...');
              try {
                console.log('Adding Somnia network...');
                await window.ethereum.request({ 
                  method: 'wallet_addEthereumChain', 
                  params: [{
                    chainId: SOMNIA.id,
                    chainName: 'Somnia Testnet',
                    nativeCurrency: { 
                      name: 'Somnia', 
                      symbol: 'STT', 
                      decimals: 18 
                    },
                    rpcUrls: [SOMNIA.rpc],
                    blockExplorerUrls: [SOMNIA.exp]
                  }]
                });
                console.log('Successfully added Somnia network');
              } catch (addError) {
                console.error('Failed to add network:', addError);
                
                if (addError.code === -32002) {
                  console.log('Network addition already in progress, waiting for user...');
                  await waitForNetworkAddition();
                  return;
                }
                
                throw new Error('Failed to add Somnia Testnet to MetaMask. Please add it manually.');
              }
            }
          } else {
            console.log('Already on Somnia network');
          }
        } catch (e) {
          console.error('Error in ensureSomnia:', e);
          throw e;
        }
      }

      // Function to wait for network addition to complete
      async function waitForNetworkAddition() {
        console.log('Waiting for network addition to complete...');
        
        // Show user-friendly message
        $('status').textContent = '⏳ Please complete the network addition in MetaMask, then wait...';
        
        // Poll for network change
        let attempts = 0;
        const maxAttempts = 30; // 30 seconds
        
        while (attempts < maxAttempts) {
          try {
            await new Promise(resolve => setTimeout(resolve, 1000)); // Wait 1 second
            const chainId = await window.ethereum.request({ method: 'eth_chainId' });
            
            if (chainId === SOMNIA.idCorrectDecimal || chainId === SOMNIA.idCorrect ||
                chainId === SOMNIA.id || chainId === SOMNIA.idDecimal || 
                chainId === SOMNIA.idAlt1 || chainId === SOMNIA.idAlt2 || chainId === SOMNIA.idAlt3) {
              console.log('Network addition completed successfully!');
              $('status').textContent = '✅ Network added successfully! Continuing connection...';
              
              // Wait a moment for MetaMask to settle
              await new Promise(resolve => setTimeout(resolve, 2000));
              
              // Continue with the connection process
              console.log('Continuing with wallet connection...');
              return true;
            }
            
            attempts++;
            $('status').textContent = `⏳ Waiting for network addition... (${attempts}/${maxAttempts})`;
          } catch (e) {
            console.log('Error while waiting for network:', e);
            attempts++;
          }
        }
        
        throw new Error('Network addition timeout. Please try connecting again.');
      }

      // Function to detect the correct Chain ID for Somnia
      async function detectCorrectChainId() {
        console.log('Detecting correct Chain ID for Somnia...');
        
        const possibleChainIds = [
          SOMNIA.idCorrectDecimal, // 50360 (try this first)
          SOMNIA.idCorrect,        // 0xC4B8 (50360 in hex)
          SOMNIA.id,               // 0xC4B8 (50312)
          SOMNIA.idDecimal,        // 50312
          SOMNIA.idAlt1,           // 0xC4B9 (50313)
          SOMNIA.idAlt2,           // 0xC4BA (50314)
          SOMNIA.idAlt3,           // 0xC4BB (50315)
          '0xC4B7',                // 50311
          '0xC4B6',                // 50310
          '0xC4B5',                // 50309
        ];
        
        for (const chainId of possibleChainIds) {
          try {
            console.log(`Trying Chain ID: ${chainId}`);
            await window.ethereum.request({ 
              method: 'wallet_switchEthereumChain', 
              params: [{ chainId: chainId }] 
            });
            console.log(`✅ Found correct Chain ID: ${chainId}`);
            return chainId;
          } catch (error) {
            console.log(`❌ Chain ID ${chainId} failed:`, error.code);
            if (error.code === -32002) {
              console.log('Pending request detected, stopping detection');
              return 'pending';
            }
          }
        }
        
        console.log('❌ No valid Chain ID found');
        return null;
      }

      // Function to check if network already exists
      async function checkNetworkExists() {
        try {
          // Try to switch to the network - if it succeeds, the network exists
          await window.ethereum.request({ 
            method: 'wallet_switchEthereumChain', 
            params: [{ chainId: SOMNIA.id }] 
          });
          return true;
        } catch (error) {
          // If error code is 4902, the network doesn't exist
          if (error.code === 4902) {
            return false;
          }
          // If it's -32002, there's a pending request
          if (error.code === -32002) {
            return 'pending';
          }
          // Other errors, assume network doesn't exist
          return false;
        }
      }

      async function connectWallet() {
        console.log('connectWallet called');
        
        if (!window.ethereum) { 
          console.error('MetaMask not found');
          alert('Install MetaMask'); 
          return null; 
        }
        
        console.log('MetaMask found, ensuring Somnia network...');
        try {
          await ensureSomnia();
          console.log('Somnia network ensured');
        } catch (e) {
          console.error('Failed to ensure Somnia network:', e);
          throw e;
        }
        
        console.log('Creating provider...');
        try {
          provider = new ethers.BrowserProvider(window.ethereum);
          console.log('Provider created');
        } catch (e) {
          console.error('Failed to create provider:', e);
          throw e;
        }
        
        console.log('Requesting accounts...');
        try {
          await provider.send("eth_requestAccounts", []);
          console.log('Accounts requested');
        } catch (e) {
          console.error('Failed to request accounts:', e);
          throw e;
        }
        
        console.log('Getting signer...');
        try {
          signer = await provider.getSigner();
          console.log('Signer obtained');
        } catch (e) {
          console.error('Failed to get signer:', e);
          throw e;
        }
        
        console.log('Getting address...');
        try {
          myAddr = await signer.getAddress();
          console.log('Address obtained:', myAddr);
        } catch (e) {
          console.error('Failed to get address:', e);
          throw e;
        }
        
        console.log('Creating contract...');
        try {
          contract = new ethers.Contract(CONTRACT_ADDR, ABI, signer);
          console.log('Contract created');
        } catch (e) {
          console.error('Failed to create contract:', e);
          throw e;
        }
        
        console.log('Wallet connection successful');
        return myAddr;
      }

      function getMyAddress() { 
        return myAddr; 
      }

      async function joinMatch(matchCode) {
        if (!contract) throw new Error('Wallet not connected');
        const matchId = ethers.id(matchCode); // bytes32
        const entryFee = await contract.entryFee();
        const tx = await contract.joinMatch(matchId, { value: entryFee });
        await tx.wait();
        return tx.hash;
      }

      async function reportMatch({ matchCode, winner, scoreA, scoreB }) {
        if (!contract) throw new Error('Wallet not connected');
        const matchId = ethers.id(matchCode); // bytes32
        const tx = await contract.reportMatch(matchId, winner, scoreA, scoreB);
        await tx.wait();
        return tx.hash;
      }

      async function getMatchDetails(matchCode) {
        if (!contract) throw new Error('Wallet not connected');
        const matchId = ethers.id(matchCode); // bytes32
        return await contract.getMatch(matchId);
      }

      async function getEntryFee() {
        if (!contract) throw new Error('Wallet not connected');
        return await contract.entryFee();
      }

      const $ = (id) => document.getElementById(id);
      
      // Wait for DOM to be loaded before setting up event handlers
      document.addEventListener('DOMContentLoaded', function() {
        console.log('DOM loaded, setting up event handlers...');
        console.log('MetaMask available:', !!window.ethereum);
        console.log('Ethers available:', !!window.ethers);
        
        $('connectBtn').onclick = async () => {
          console.log('Connect button clicked');
          try {
            const addr = await connectWallet();
            if (addr) {
              $('wallet').textContent = `Connected: ${addr.slice(0,6)}...${addr.slice(-4)}`;
              $('joinBtn').disabled = false;
              $('addNetworkBtn').style.display = 'none';
              
              // Show entry fee
              try {
                const fee = await getEntryFee();
                const feeEth = ethers.formatEther(fee);
                $('status').textContent = `Entry fee: ${feeEth} STT`;
              } catch (e) {
                console.log('Could not get entry fee:', e);
              }
            }
          } catch (e) {
            console.error('Failed to connect wallet:', e);
            $('wallet').textContent = 'Connection failed';
            $('addNetworkBtn').style.display = 'inline-block';
            
            // Show specific error messages
            if (e.message.includes('timeout')) {
              $('status').textContent = '⏰ Network addition timed out. Please try connecting again.';
            } else if (e.message.includes('Failed to add Somnia Testnet')) {
              $('status').textContent = '❌ Failed to add network automatically. Click "Add Somnia Network" to add it manually.';
            } else {
              $('status').textContent = '❌ Connection failed: ' + e.message;
            }
          }
        };

        $('addNetworkBtn').onclick = async () => {
          console.log('Add network button clicked');
          try {
            await window.ethereum.request({ 
              method: 'wallet_addEthereumChain', 
              params: [{
                chainId: SOMNIA.id,
                chainName: 'Somnia Testnet',
                nativeCurrency: { 
                  name: 'Somnia', 
                  symbol: 'STT', 
                  decimals: 18 
                },
                rpcUrls: [SOMNIA.rpc],
                blockExplorerUrls: [SOMNIA.exp]
              }]
            });
            $('status').textContent = '✅ Network added! Now try connecting again.';
            $('addNetworkBtn').style.display = 'none';
          } catch (e) {
            console.error('Failed to add network:', e);
            if (e.code === -32002) {
              $('status').textContent = '⚠️ Network addition already in progress. Please complete it in MetaMask first.';
            } else {
              $('status').textContent = '❌ Failed to add network: ' + e.message;
              // Show manual instructions
              $('status').innerHTML = `
                ❌ Failed to add network automatically.<br>
                <strong>Manual Setup:</strong><br>
                1. Open MetaMask<br>
                2. Click network dropdown → "Add Network" → "Add Network Manually"<br>
                3. Enter: Network Name: Somnia Testnet, RPC URL: https://dream-rpc.somnia.network, Chain ID: 50312, Currency: STT
              `;
            }
          }
        };

        $('joinBtn').onclick = async () => {
          console.log('Join button clicked');
          try {
            const code = $('matchCode').value || 'DEMO123';
            $('status').textContent = 'Joining match...';
            const txHash = await joinMatch(code);
            $('status').innerHTML = `✅ Joined! <a target="_blank" href="https://shannon-explorer.somnia.network/tx/${txHash}">View TX</a>`;
          } catch (e) {
            console.error('Failed to join match:', e);
            $('status').textContent = '❌ Join failed: ' + e.message;
          }
        };

        console.log('Event handlers set up successfully');
      });

      // Expose helpers for the game code to call at game over
      window.__somnia__ = {
        async submitResult({ winnerAddress, scoreA, scoreB }) {
          try {
            $('status').textContent = 'Submitting on-chain...';
            const code = $('matchCode').value || 'DEMO123';
            const txHash = await reportMatch({ matchCode: code, winner: winnerAddress, scoreA, scoreB });
            $('status').innerHTML = `✅ Submitted! <a target="_blank" href="https://shannon-explorer.somnia.network/tx/${txHash}">View TX</a>`;
          } catch (e) {
            console.error('Submit failed:', e);
            $('status').textContent = '❌ Submit failed: ' + e.message;
          }
        },
        getMyAddress
      };
    </script>
  </body>
</html>
