unEiBC13yO/eizEIHWq+8+OWT" type="audio/wav"></audio><script>// Web3 functionality

      let provider, signer, contract, myAddr;

      async function ensureSomnia() {
        console.log('ensureSomnia called');
        
        try {
          const chainId = await window.ethereum.request({ method: 'eth_chainId' });
          console.log('Current chain ID:', chainId);
          console.log('Expected chain ID (50360):', SOMNIA.idCorrectDecimal);
          console.log('Expected chain ID (50360 hex):', SOMNIA.idCorrect);
          console.log('Expected chain ID (50312):', SOMNIA.idDecimal);
          console.log('Expected chain ID (50312 hex):', SOMNIA.id);
          
          // Check if we're on the correct network (prioritizing 50312)
          if (chainId !== SOMNIA.idDecimal && chainId !== SOMNIA.id && 
              chainId !== SOMNIA.idCorrectDecimal && chainId !== SOMNIA.idCorrect) {
            console.log('Not on Somnia network, detecting correct Chain ID...');
            
            // First, try to detect the correct Chain ID
            const correctChainId = await detectCorrectChainId();
            console.log('Detected Chain ID:', correctChainId);
            
            if (correctChainId === 'pending') {
              console.log('Network addition already pending, waiting for user...');
              $('status').textContent = '⏳ Network addition in progress. Please complete it in MetaMask...';
              await waitForNetworkAddition();
              return;
            }
            
            if (correctChainId) {
              console.log('Found existing Somnia network, switching to it...');
              try {
                await window.ethereum.request({ 
                  method: 'wallet_switchEthereumChain', 
                  params: [{ chainId: correctChainId }] 
                });
                console.log('Successfully switched to Somnia');
              } catch (switchError) {
                console.error('Failed to switch to network:', switchError);
                throw new Error('Failed to switch to Somnia network');
              }
            } else {
              console.log('No existing Somnia network found, trying to add it with different currency symbols...');
              
              // Try different currency symbols
              const currencySymbols = ['SOM', 'STT', 'SOMNIA', 'TEST'];
              let networkAdded = false;
              
              for (const currency of currencySymbols) {
                if (await tryAddNetworkWithCurrency(SOMNIA.idDecimal, currency)) {
                  networkAdded = true;
                  break;

              }
              
              if (!networkAdded) {
                console.log('All currency symbols failed, trying with STT as fallback...');
                try {
                  await window.ethereum.request({ 
                    method: 'wallet_addEthereumChain', 
                    params: [{
                      chainId: SOMNIA.idDecimal,
                      chainName: 'Somnia Testnet',
                      nativeCurrency: { 
                        name: 'Somnia', 
                        symbol: 'STT', 
                        decimals: 18

                      rpcUrls: [SOMNIA.rpc],
                      blockExplorerUrls: [SOMNIA.exp]
                    }]

                  console.log('Successfully added Somnia network with STT');
                } catch (addError) {
                  console.error('Failed to add network:', addError);
                  
                  if (addError.code === -32002) {
                    console.log('Network addition already in progress, waiting for user...');
                    await waitForNetworkAddition();
                    return;
                  }
                  
                  throw new Error('Failed to add Somnia Testnet to MetaMask. Please add it manually.');
                }
              }
            }
          } else {
            console.log('Already on Somnia network');
          }
        } catch (e) {
          console.error('Error in ensureSomnia:', e);
          throw e;
        }
      }

      // Function to wait for network addition to complete
      async function waitForNetworkAddition() {
        console.log('Waiting for network addition to complete...');
        
        // Show user-friendly message
        $('status').textContent = '⏳ Please complete the network addition in MetaMask, then wait...';
        
        // Poll for network change
        let attempts = 0;
        const maxAttempts = 30; // 30 seconds
        
        while (attempts < maxAttempts) {
          try {
            await new Promise(resolve => setTimeout(resolve, 1000)); // Wait 1 second
            const chainId = await window.ethereum.request({ method: 'eth_chainId' });
            
            if (chainId === SOMNIA.idCorrectDecimal || chainId === SOMNIA.idCorrect ||
                chainId === SOMNIA.id || chainId === SOMNIA.idDecimal || 
                chainId === SOMNIA.idAlt1 || chainId === SOMNIA.idAlt2 || chainId === SOMNIA.idAlt3) {
              console.log('Network addition completed successfully!');
              $('status').textContent = '✅ Network added successfully! Continuing connection...';
              
              // Wait a moment for MetaMask to settle
              await new Promise(resolve => setTimeout(resolve, 2000));
              
              // Continue with the connection process
              console.log('Continuing with wallet connection...');
              return true;
            }
            
            attempts++;
            $('status').textContent = `⏳ Waiting for network addition... (${attempts}/${maxAttempts})`;
          } catch (e) {
            console.log('Error while waiting for network:', e);
            attempts++;
          }
        }
        
        throw new Error('Network addition timeout. Please try connecting again.');
      }

      // Function to try different currency symbols
      async function tryAddNetworkWithCurrency(chainId, currencySymbol) {
        try {
          console.log(`Trying to add network with Chain ID: ${chainId}, Currency: ${currencySymbol}`);
          await window.ethereum.request({ 
            method: 'wallet_addEthereumChain',

          return false;

      // Function to detect the correct Chain ID for Somnia
      async function detectCorrectChainId() {
        console.log('Detecting correct Chain ID for Somnia...');
        
        const possibleChainIds = [
          SOMNIA.idDecimal,        // 50312 (try this first)
          SOMNIA.id,               // 0xC4B8 (50312 in hex)
          SOMNIA.idCorrectDecimal, // 50360 (fallback)
          SOMNIA.idCorrect,        // 0xC4B8 (50360 in hex)
          SOMNIA.idAlt1,           // 0xC4B9 (50313)
          SOMNIA.idAlt2,           // 0xC4BA (50314)
          SOMNIA.idAlt3,           // 0xC4BB (50315)
          '0xC4B7',                // 50311
          '0xC4B6',                // 50310
          '0xC4B5',                // 50309
        ];
        
        for (const chainId of possibleChainIds) {
          try {
            console.log(`Trying Chain ID: ${chainId}`);
            await window.ethereum.request({ 
              method: 'wallet_switchEthereumChain', 
              params: [{ chainId: chainId }] 
            });
            console.log(`✅ Found correct Chain ID: ${chainId}`);
            return chainId;
          } catch (error) {
            console.log(`❌ Chain ID ${chainId} failed:`, error.code);
            if (error.code === -32002) {
              console.log('Pending request detected, stopping detection');
              return 'pending';
            }
          }
        }
        
        console.log('❌ No valid Chain ID found');
        return null;
      }

      // Function to check if network already exists
      async function checkNetworkExists() {
        try {
          // Try to switch to the network - if it succeeds, the network exists
          await window.ethereum.request({ 
            method: 'wallet_switchEthereumChain', 
            params: [{ chainId: SOMNIA.id }] 
          });
          return true;
        } catch (error) {
          // If error code is 4902, the network doesn't exist
          if (error.code === 4902) {
            return false;
          }
          // If it's -32002, there's a pending request
          if (error.code === -32002) {
            return 'pending';
          }
          // Other errors, assume network doesn't exist
          return false;
        }
      }

      // Background music control

      // Function to simulate user interaction for audio context
      function simulateUserInteraction() {
        // Create a silent audio context to unlock audio
        try {
          const audioContext = new (window.AudioContext || window.webkitAudioContext)();
          const oscillator = audioContext.createOscillator();
          const gainNode = audioContext.createGain();
          
          oscillator.connect(gainNode);
          gainNode.connect(audioContext.destination);
          
          oscillator.frequency.value = 1; // Very low frequency
          gainNode.gain.value = 0; // Silent
          
          oscillator.start();
          oscillator.stop(audioContext.currentTime + 0.1);
          
          // Try to resume audio context and play music
          audioContext.resume().then(() => {
            if (backgroundMusic && !musicStarted) {
              backgroundMusic.play().then(() => {
                console.log('🎵 Background music started after audio context unlock');
                musicStarted = true;

          right: 20px;
          padding: 8px 16px;
          background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
          color: white;
          border: none;
          border-radius: 8px;
          cursor: pointer;
          font-family: 'Orbitron', monospace;
          font-size: 12px;
          z-index: 1001;
          box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        `;
        musicBtn.onclick = () => {
          if (backgroundMusic) {
            backgroundMusic.play();
            musicBtn.remove();
          }
        };
        document.body.appendChild(musicBtn);
      }

      // Wait for DOM to be loaded before setting up event handlers
      document.addEventListener('DOMContentLoaded', function() {
        console.log('DOM loaded, setting up event handlers...');
        console.log('MetaMask available:', !!window.ethereum);
        console.log('Ethers available:', !!window.ethers);
        
        // Start background music after a short delay
        setTimeout(startBackgroundMusic, 1000);
        
        $('connectBtn').onclick = async () => {
          console.log('Connect button clicked');
          
          // Play click sound
          const clickSound = document.getElementById('clickSound');
          if (clickSound) {
            clickSound.currentTime = 0;
            clickSound.play().catch(e => console.log('Sound play failed:', e));
          }
          
          try {
            const addr = await connectWallet();
            if (addr) {
              // Connected
              $('wallet').textContent = `🔗 Connected: ${addr.slice(0,6)}...${addr.slice(-4)}`;
              $('connectBtn').textContent = 'Disconnect Wallet';
              $('connectBtn').classList.add('connected');
              $('joinBtn').disabled = false;
              $('addNetworkBtn').style.display = 'none';
              
              // Show entry fee
              try {
                const fee = await getEntryFee();
                const feeEth = ethers.formatEther(fee);
                $('status').textContent = `💰 Entry fee: ${feeEth} STT`;
              } catch (e) {
                console.log('Could not get entry fee:', e);
              }
            } else {
              // Disconnected
              $('wallet').textContent = '🔌 Not connected';
              $('connectBtn').textContent = 'Connect Wallet';
              $('connectBtn').classList.remove('connected');
              $('joinBtn').disabled = true;
              $('addNetworkBtn').style.display = 'none';
              $('status').textContent = '';
            }
          } catch (e) {
            console.error('Failed to connect wallet:', e);
            $('wallet').textContent = '❌ Connection failed';
            $('connectBtn').textContent = 'Connect Wallet';
            $('connectBtn').classList.remove('connected');
            $('addNetworkBtn').style.display = 'inline-block';
            
            // Show specific error messages
            if (e.message.includes('timeout')) {
              $('status').textContent = '⏰ Network addition timed out. Please try connecting again.';
            } else if (e.message.includes('Failed to add Somnia Testnet')) {
              $('status').textContent = '❌ Failed to add network automatically. Click "Add Somnia Network" to add it manually.';
            } else {
              $('status').textContent = '❌ Connection failed: ' + e.message;
            }
          }
        };

        $('addNetworkBtn').onclick = async () => {
          console.log('Add network button clicked');
          try {
                          await window.ethereum.request({ 
                method: 'wallet_addEthereumChain', 
                params: [{
                  chainId: SOMNIA.idDecimal, // Use 50312
                  chainName: 'Somnia Testnet',
                  nativeCurrency: { 
                    name: 'Somnia', 
                    symbol: 'SOM', // Try different currency symbol
                    decimals: 18 
                  },
                  rpcUrls: [SOMNIA.rpc],
                  blockExplorerUrls: [SOMNIA.exp]
                }]
              });
            $('status').textContent = '✅ Network added! Now try connecting again.';
            $('addNetworkBtn').style.display = 'none';
          } catch (e) {
            console.error('Failed to add network:', e);
            if (e.code === -32002) {
              $('status').textContent = '⚠️ Network addition already in progress. Please complete it in MetaMask first.';
            } else {
              $('status').textContent = '❌ Failed to add network: ' + e.message;
              // Show manual instructions
              $('status').innerHTML = `
                ❌ Failed to add network automatically.<br>
                <strong>Manual Setup:</strong><br>
                1. Open MetaMask<br>
                2. Click network dropdown → "Add Network" → "Add Network Manually"<br>
                3. Enter: Network Name: Somnia Testnet, RPC URL: https://dream-rpc.somnia.network, Chain ID: 50312, Currency: SOM
              `;
            }
          }
        };

        $('joinBtn').onclick = async () => {
          console.log('Join button clicked');
          
          // Play click sound
          const clickSound = document.getElementById('clickSound');
          if (clickSound) {
            clickSound.currentTime = 0;
            clickSound.play().catch(e => console.log('Sound play failed:', e));
          }
          
          try {
            const code = $('matchCode').value || 'DEMO123';
            $('status').textContent = '🔄 Joining match...';
            const txHash = await joinMatch(code);
            
            // Play success sound
            const successSound = document.getElementById('successSound');
            if (successSound) {
              successSound.currentTime = 0;
              successSound.play().catch(e => console.log('Sound play failed:', e));
            }
            
            $('status').innerHTML = `✅ Joined! <a target="_blank" href="https://shannon-explorer.somnia.network/tx/${txHash}">View TX</a>`;
          } catch (e) {
            console.error('Failed to join match:', e);
            $('status').textContent = '❌ Join failed: ' + e.message;
          }
        };

        console.log('Event handlers set up successfully');
      });

      // Expose helpers for the game code to call at game over
      window.__somnia__ = {
        async submitResult({ winnerAddress, scoreA, scoreB }) {
          try {
            $('status').textContent = 'Submitting on-chain...';
            const code = $('matchCode').value || 'DEMO123';
            const txHash = await reportMatch({ matchCode: code, winner: winnerAddress, scoreA, scoreB });
            $('status').innerHTML = `✅ Submitted! <a target="_blank" href="https://shannon-explorer.somnia.network/tx/${txHash}">View TX</a>`;
          } catch (e) {
            console.error('Submit failed:', e);
            $('status').textContent = '❌ Submit failed: ' + e.message;
          }
        },
        getMyAddress
      };</script></body></html>
